<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta Débito</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111827;
}

.card{
    width:420px;
    height:250px;
    border-radius:24px;
    background:linear-gradient(135deg,#FFD200,#F4B400);
    padding:28px;
    color:#111;
    position:relative;
    overflow:hidden;
    box-shadow:0 25px 50px rgba(0,0,0,.35);
}

.card::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    top:-140px;
    right:-100px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bank{
    font-size:24px;
    font-weight:700;
}

.debit{
    font-size:14px;
    font-weight:600;
}

.chip{
    width:60px;
    height:45px;
    border-radius:8px;
    margin-top:20px;
    background:linear-gradient(#e0e0e0,#bdbdbd);
}

.number{
    margin-top:25px;
    font-size:28px;
    letter-spacing:4px;
    font-weight:600;
}

.footer{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
}

.label{
    font-size:10px;
    text-transform:uppercase;
    opacity:.7;
}

.value{
    font-size:15px;
    font-weight:700;
    margin-top:4px;
}

.brand{
    position:absolute;
    bottom:25px;
    right:25px;
    font-size:22px;
    font-weight:700;
}
</style>
</head>
<body>

<div class="card">

    <div class="header">
        <div class="bank">BANCO DIGITAL</div>
        <div class="debit">DÉBITO</div>
    </div>

    <div class="chip"></div>

    <div class="number">
        1234 5678 9012 3456
    </div>

    <div class="footer">
        <div>
            <div class="label">Titular</div>
            <div class="value">NOMBRE APELLIDO</div>
        </div>

        <div>
            <div class="label">Vence</div>
            <div class="value">12/29</div>
        </div>

        <div>
            <div class="label">CVC</div>
            <div class="value">123</div>
        </div>
    </div>

    <div class="brand">CARD</div>

</div>

</body>
</html>
