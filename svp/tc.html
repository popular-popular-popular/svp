<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Tarjeta Débito</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#f3f4f6;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:420px;
}

.card-container{
    perspective:1000px;
    margin-bottom:30px;
}

.card{
    width:100%;
    height:240px;
    position:relative;
    transform-style:preserve-3d;
    transition:.8s;
}

.card.flip{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:22px;
    backface-visibility:hidden;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.front{
    background:linear-gradient(135deg,#ffd100,#f4b000);
    padding:25px;
}

.back{
    background:linear-gradient(135deg,#ffd100,#f4b000);
    transform:rotateY(180deg);
}

.bank{
    font-size:28px;
    font-weight:700;
    color:#111;
}

.chip{
    width:60px;
    height:45px;
    border-radius:8px;
    background:linear-gradient(#ececec,#cfcfcf);
    margin-top:25px;
}

.number{
    margin-top:30px;
    font-size:28px;
    letter-spacing:3px;
    color:#111;
    font-weight:600;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

.label{
    font-size:11px;
    color:#444;
}

.value{
    font-size:15px;
    font-weight:bold;
    color:#111;
}

.black-bar{
    width:100%;
    height:50px;
    background:#111;
    margin-top:30px;
}

.cvc-box{
    margin:30px 20px;
    background:white;
    height:45px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:15px;
    font-size:22px;
    font-weight:bold;
}

.form{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.form input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    font-size:16px;
}

.row{
    display:flex;
    gap:10px;
}
</style>
</head>
<body>

<div class="container">

    <div class="card-container">
        <div class="card" id="card">

            <div class="face front">

                <div class="bank">BANCO DEMO</div>

                <div class="chip"></div>

                <div class="number" id="cardNumber">
                    0000 0000 0000 0000
                </div>

                <div class="info">
                    <div>
                        <div class="label">TITULAR</div>
                        <div class="value" id="cardName">
                            NOMBRE APELLIDO
                        </div>
                    </div>

                    <div>
                        <div class="label">VENCE</div>
                        <div class="value" id="cardExpiry">
                            00/00
                        </div>
                    </div>
                </div>

            </div>

            <div class="face back">

                <div class="black-bar"></div>

                <div class="cvc-box" id="cardCvc">
                    000
                </div>

            </div>

        </div>
    </div>

    <div class="form">

        <input
            type="text"
            id="number"
            maxlength="19"
            placeholder="Número de tarjeta">

        <input
            type="text"
            id="name"
            placeholder="Nombre del titular">

        <div class="row">
            <input
                type="text"
                id="expiry"
                maxlength="5"
                placeholder="MM/AA">

            <input
                type="text"
                id="cvc"
                maxlength="3"
                placeholder="CVC">
        </div>

    </div>

</div>

<script>

const card = document.getElementById("card");

document.getElementById("number").addEventListener("input", e => {

    let value = e.target.value
        .replace(/\D/g,'')
        .replace(/(.{4})/g,'$1 ')
        .trim();

    e.target.value = value;

    document.getElementById("cardNumber").textContent =
        value || "0000 0000 0000 0000";
});

document.getElementById("name").addEventListener("input", e => {

    document.getElementById("cardName").textContent =
        e.target.value.toUpperCase() || "NOMBRE APELLIDO";
});

document.getElementById("expiry").addEventListener("input", e => {

    let value = e.target.value
        .replace(/\D/g,'');

    if(value.length > 2){
        value = value.slice(0,2) + "/" + value.slice(2,4);
    }

    e.target.value = value;

    document.getElementById("cardExpiry").textContent =
        value || "00/00";
});

const cvcInput = document.getElementById("cvc");

cvcInput.addEventListener("focus", () => {
    card.classList.add("flip");
});

cvcInput.addEventListener("blur", () => {
    card.classList.remove("flip");
});

cvcInput.addEventListener("input", e => {

    const value = e.target.value.replace(/\D/g,'');

    e.target.value = value;

    document.getElementById("cardCvc").textContent =
        value || "000";
});

</script>

</body>
</html>
